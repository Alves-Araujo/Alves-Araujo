name: Contribution graph

on:
  schedule:
    - cron: "0 3 * * *"   # todo dia as 03:00 UTC
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Gera o SVG
        env:
          GH_USER: ${{ github.repository_owner }}
          OUT_PATH: assets/contribution-graph.svg
        run: python3 .github/scripts/contrib_graph.py

      - name: Commita se mudou
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contribution-graph.svg
          git diff --staged --quiet || git commit -m "chore: atualiza grafico de contribuicoes"
          git push
