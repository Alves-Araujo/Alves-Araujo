<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 14" width="1200" height="14"
     role="img" aria-label="">
  <defs>
    <linearGradient id="dflow" gradientUnits="userSpaceOnUse" x1="-1200" y1="0" x2="1200" y2="0">
      <stop offset="0.0" stop-color="#22e6e0"/><stop offset="0.0625" stop-color="#46b8f5"/><stop offset="0.125" stop-color="#6f7bfa"/><stop offset="0.1875" stop-color="#a855f0"/><stop offset="0.25" stop-color="#ff3ee0"/><stop offset="0.3125" stop-color="#a855f0"/><stop offset="0.375" stop-color="#6f7bfa"/><stop offset="0.4375" stop-color="#46b8f5"/><stop offset="0.5" stop-color="#22e6e0"/><stop offset="0.5625" stop-color="#46b8f5"/><stop offset="0.625" stop-color="#6f7bfa"/><stop offset="0.6875" stop-color="#a855f0"/><stop offset="0.75" stop-color="#ff3ee0"/><stop offset="0.8125" stop-color="#a855f0"/><stop offset="0.875" stop-color="#6f7bfa"/><stop offset="0.9375" stop-color="#46b8f5"/><stop offset="1" stop-color="#22e6e0"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="1200 0"
                        dur="7.5s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="dfade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#000"/><stop offset="14%" stop-color="#fff"/>
      <stop offset="86%"  stop-color="#fff"/><stop offset="100%" stop-color="#000"/>
    </linearGradient>
    <mask id="dmask"><rect width="1200" height="14" fill="url(#dfade)"/></mask>
    <filter id="dglow" x="-10%" y="-500%" width="120%" height="1100%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g mask="url(#dmask)">
    <rect x="0" y="5.5" width="1200" height="3" rx="1.5" fill="url(#dflow)" filter="url(#dglow)">
      <animate attributeName="opacity" values="0.75;1;0.75" dur="4.5s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
